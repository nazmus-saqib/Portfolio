<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="View or download Molla Nazmus Saqib's résumé.">
  <title>Molla Nazmus Saqib — Résumé</title>
  <style>
    :root { color-scheme: light; color: #293c30; background: #eef0e6; font-family: Arial, Helvetica, sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100svh; display: grid; place-items: center; padding: 24px; }
    main { width: 100%; max-width: 620px; padding: clamp(24px, 6vw, 48px); border: 1px solid #c4cfb5; border-radius: 20px; background: #f8f9f3; }
    .eyebrow { margin: 0 0 12px; color: #586f49; font-size: 14px; letter-spacing: .12em; text-transform: uppercase; }
    h1 { margin: 0 0 16px; font-size: clamp(30px, 7vw, 44px); line-height: 1.1; }
    p { font-size: 16px; line-height: 1.6; }
    .actions { display: flex; flex-wrap: wrap; gap: 12px; margin: 28px 0; }
    a { color: inherit; text-underline-offset: 4px; }
    .button { display: inline-flex; align-items: center; justify-content: center; min-height: 48px; padding: 12px 20px; border: 1px solid #395431; border-radius: 8px; font-size: 16px; font-weight: 600; text-decoration: none; }
    .primary { color: #fff; background: #395431; }
    a:focus-visible { outline: 3px solid #829b50; outline-offset: 4px; }
    .back { font-size: 14px; }
  </style>
</head>
<body>
  <main>
    <p class="eyebrow">Résumé</p>
    <h1>Molla Nazmus Saqib</h1>
    <p>View my résumé in your browser or download the PDF.</p>
    <div class="actions">
      <a class="button primary" href="./Molla_Nazmus_Saqib_Project_Coordinator_Resume.pdf">View résumé</a>

</body>
</html>
